name: Repository security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy-and-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve comparison base
        id: comparison
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$EVENT_BASE" =~ ^0+$ || -z "$EVENT_BASE" ]]; then
            EVENT_BASE=$(git rev-list --max-parents=0 HEAD | head -1)
          fi
          git cat-file -e "$EVENT_BASE^{commit}"
          echo "base=$EVENT_BASE" >> "$GITHUB_OUTPUT"
      - name: Check changed files
        run: python3 scripts/check_repository_policy.py --base '${{ steps.comparison.outputs.base }}'
      - name: Download verified Gitleaks
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan introduced history
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base }}
        run: "$RUNNER_TEMP/gitleaks" git --log-opts="${BASE_SHA}..HEAD" --redact=100 --no-banner --log-level warn .
